name: Build e Empacotamento

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar e Gerar Pacote JAR
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "segredo-de-teste-ci-com-mais-de-32-bytes-para-execucao-completa"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Conceder permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Compilar e gerar JAR
        run: ./gradlew build -x test --no-daemon

      - name: Publicar artefato JAR gerado
        uses: actions/upload-artifact@v4
        with:
          name: weather-api-jar
          path: build/libs/*.jar
          retention-days: 14
