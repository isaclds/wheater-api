spring.application.name=weather-api

# ── Banco de dados H2 (dev/test) ─────────────────────────────────
spring.datasource.url=jdbc:h2:mem:weatherdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ── Segurança e JWT ──────────────────────────────────────────────
jwt.secret=6ad6e9cd2f1700b45822576485153b710ab70c7eb9441d1d8837239b0217d21c
jwt.expiration-minutes=30
jwt.issuer=weather-api
sse.heartbeat-seconds=25
sse.max-conexoes-por-cliente=5

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── OpenAPI / Swagger UI ─────────────────────────────────────────
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/docs-json
